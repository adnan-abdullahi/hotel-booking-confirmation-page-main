<!DOCTYPE html>

<!-- ============================================================
     Hotel Booking Confirmation Page
     Frontend Mentor Challenge

     Author  : Adnan Abdullahi
     Project : Hotel Booking Confirmation Page
     Purpose : Semantic HTML implementation following
               engineering best practices.

     This document serves as the structural foundation
     of the application before CSS and JavaScript are applied.
============================================================= -->

<html lang="en">

    <head>

        <!-- ========================================================
            Document Metadata
        ========================================================= -->

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

        <meta
            name="description"
            content="Hotel Booking Confirmation Page built as a Frontend Mentor challenge using semantic HTML, CSS, and JavaScript.">

        <title>Hotel Booking Confirmation Page</title>

        <!-- ========================================================
            Google Fonts

            Fraunces
            DM Sans
            DM Mono
        ========================================================= -->

        <link
            rel="preconnect"
            href="https://fonts.googleapis.com">

        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin>

        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,400;1,400&display=swap"
            rel="stylesheet">

        <!-- ========================================================
            Main Stylesheet
        ========================================================= -->

        <link
            rel="stylesheet"
            href="css/style.css">

        <!-- ========================================================
            Main JavaScript

            The 'defer' attribute ensures that JavaScript
            executes only after the HTML has been fully parsed.
        ========================================================= -->

        <script
            src="js/script.js"
            defer>
        </script>

    </head>

    <!-- ============================================================
        Body
        Main Application Layout
    ============================================================ -->

    <body>

        <!-- ========================================================
            Application Wrapper

            This wrapper contains the entire webpage.
            It will later become our primary CSS layout container.
        ========================================================= -->

        <div class="app">

            <!-- ==========================================================
                SIDEBAR
                Contains the hotel branding, navigation, weather card,
                and hotel information.
            ========================================================== -->

            <aside class="sidebar">

                <!-- ======================================================
                    SIDEBAR HEADER
                    Displays the Maison Soleil brand and the mobile menu
                    toggle button.
                ======================================================= -->

                <header class="sidebar__header">

                    <!-- ==============================================
                        BRAND
                        Groups the hotel logo and brand name.
                    =============================================== -->

                    <div class="sidebar__brand">

                        <!-- Hotel Logo -->

                        <img
                            class="sidebar__logo"
                            src="images/logo.svg"
                            alt="Maison Soleil logo">

                    </div>

                    <!-- ==============================================
                        MOBILE MENU TOGGLE
                        Hidden on desktop.
                        Displayed on smaller screens.
                    =============================================== -->

                    <button
                        class="sidebar__menu-button"
                        type="button"
                        aria-expanded="false"
                        aria-controls="sidebar-navigation"
                        aria-label="Open navigation menu">

                        <img
                            class="sidebar__menu-icon"
                            src="images/icon-menu.svg"
                            alt="">

                    </button>

                </header>

                <!-- ======================================================
                    SIDEBAR NAVIGATION
                    Primary navigation for the hotel guest dashboard.
                ====================================================== -->

                <nav
                    class="sidebar__navigation"
                    aria-label="Primary navigation">

                    <ul class="sidebar__navigation-list">

                        <!-- ==============================================
                            Navigation Item — Your Stay (Active)
                        =============================================== -->

                        <li class="sidebar__navigation-item">

                            <a
                                class="sidebar__navigation-link sidebar__navigation-link--active"
                                href="#">

                                <img
                                    class="sidebar__navigation-icon"
                                    src="images/icon-bed.svg"
                                    alt="">

                                <span class="sidebar__navigation-text">
                                    Your stay
                                </span>

                                <span
                                    class="sidebar__navigation-badge"
                                    aria-label="1 notification">
                                    1
                                </span>

                            </a>

                        </li>

                        <!-- ==============================================
                            Navigation Item — The House
                        =============================================== -->

                        <li class="sidebar__navigation-item">

                            <a
                                class="sidebar__navigation-link"
                                href="#">

                                <img
                                    class="sidebar__navigation-icon"
                                    src="images/icon-house.svg"
                                    alt="">

                                <span class="sidebar__navigation-text">
                                    The house
                                </span>

                            </a>

                        </li>

                        <!-- ==============================================
                            Navigation Item — Around Town
                        =============================================== -->

                        <li class="sidebar__navigation-item">

                            <a
                                class="sidebar__navigation-link"
                                href="#">

                                <img
                                    class="sidebar__navigation-icon"
                                    src="images/icon-pin.svg"
                                    alt="">

                                <span class="sidebar__navigation-text">
                                    Around town
                                </span>

                            </a>

                        </li>

                        <!-- ==============================================
                            Navigation Item — Breakfast
                        =============================================== -->

                        <li class="sidebar__navigation-item">

                            <a
                                class="sidebar__navigation-link"
                                href="#">

                                <img
                                    class="sidebar__navigation-icon"
                                    src="images/icon-breakfast-outline.svg"
                                    alt="">

                                <span class="sidebar__navigation-text">
                                    Breakfast
                                </span>

                            </a>

                        </li>

                        <!-- ==============================================
                            Navigation Item — Messages
                        =============================================== -->

                        <li class="sidebar__navigation-item">

                            <a
                                class="sidebar__navigation-link"
                                href="#">

                                <img
                                    class="sidebar__navigation-icon"
                                    src="images/icon-mail.svg"
                                    alt="">

                                <span class="sidebar__navigation-text">
                                    Messages
                                </span>

                            </a>

                        </li>

                    </ul>

                </nav>

                <!-- ======================================================
                    WEATHER CARD
                    Displays the current weather information for Cassis.
                ====================================================== -->

                <section class="sidebar__weather">

                    <!-- Weather Card -->

                    <div class="weather-card">

                        <!-- ==========================================
                            Decorative Weather Illustration
                        =========================================== -->

                        <img
                            class="weather-card__sun"
                            src="images/illustration-sun.svg"
                            alt="">

                        <!-- ==========================================
                            Weather Location
                        =========================================== -->

                        <p class="weather-card__location">

                            Today in Cassis

                        </p>

                        <!-- ==========================================
                            Current Temperature
                        =========================================== -->

                        <p class="weather-card__temperature">

                            27°

                        </p>

                        <!-- ==========================================
                            Weather Description
                        =========================================== -->

                        <p class="weather-card__description">

                            Sunny · light breeze

                        </p>

                    </div>

                </section>

                <!-- ======================================================
                    SIDEBAR FOOTER
                    Displays hotel establishment details and address.
                ====================================================== -->

                <footer class="sidebar__footer">

                    <!-- ==============================================
                        Hotel Establishment Year
                    =============================================== -->

                    <p class="sidebar__established">

                        EST. 1987

                    </p>

                    <!-- ==============================================
                        Hotel Address
                    =============================================== -->

                    <address class="sidebar__address">

                        Maison Soleil ·
                        12 Rue des Oliviers ·
                        Cassis

                    </address>

                    <!-- ==============================================
                        Copyright Information
                    =============================================== -->

                    <p class="sidebar__copyright">

                        &copy; 2026 Maison Soleil

                    </p>

                </footer>

            </aside>

            <!-- ====================================================
                Main Content

                Contains:
                - Booking Confirmation
                - Booking Receipt
                - Welcome Message
                - Guest Information Cards
            ===================================================== -->

            <main class="main-content">

            </main>

        </div>

    </body>

</html>
